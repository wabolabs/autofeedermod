substitutions:
  name: autofeeder
  friendly_name: "Chicken Feed Dispenser"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: true

matter:
  enabled: true

# Display (SSD1306 128x64 SPI)
spi:
  clk_pin: GPIO16
  mosi_pin: GPIO17

display:
  - platform: ssd1306_spi
    model: "SSD1306 128x64"
    cs_pin: GPIO13
    dc_pin: GPIO14
    reset_pin: GPIO15
    rotation: 0
    lambda: |-
      it.print(0, 0, id(font), "Autofeeder");

font:
  - file: "arial.ttf"
    id: font
    size: 12

# Motor (DRV8871 H-Bridge)
output:
  - platform: gpio
    pin: GPIO9
    id: motor_in1
  - platform: gpio
    pin: GPIO10
    id: motor_in2

# Buttons via ADC resistor ladder on GPIO2
sensor:
  - platform: adc
    pin: GPIO2
    id: button_adc
    name: "Buttons ADC"
    update_interval: 50ms
    internal: true
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

# Button mapping via ADC thresholds
# Values: SW1=0.15V, SW2=0.35V, SW3=0.55V, SW4=0.80V, SW5=1.10V, SW6=1.50V
  - platform: adc
    pin: GPIO5
    id: battery_voltage
    name: "Battery Voltage"
    update_interval: 60s
    filters:
      - multiply: 2.0

# CAN Bus (TWAI)
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: GPIO18
    rx_pin: GPIO21
    can_id: 0x100
    bit_rate: 500kbps

# Status LED
light:
  - platform: binary
    name: "Status LED"
    output:
      pin: GPIO6

deep_sleep:
  run_duration: 10min
  sleep_duration: 10min
