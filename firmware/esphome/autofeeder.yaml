substitutions:
  name: autofeeder
  friendly_name: "Chicken Feed Dispenser"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    version: recommended

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: true

# ===== I2C BUS (DS3231 RTC) =====
i2c:
  sda: 13
  scl: 23
  scan: false
  frequency: 100kHz

# ===== TIME SOURCES =====
time:
  - platform: ds1307
    id: rtc_time
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - lambda: |-
              static int last_checked_minute = -1;
              auto now = id(rtc_time).now();
              if (!now.is_valid()) return;
              int current_min = now.minute;
              if (current_min == last_checked_minute) return;
              last_checked_minute = current_min;
              for (int slot = 0; slot < 4; slot++) {
                int h, m, d; bool en;
                switch (slot) {
                  case 0: h = id(sched0_hour); m = id(sched0_min); d = id(sched0_dur); en = id(sched0_enabled); break;
                  case 1: h = id(sched1_hour); m = id(sched1_min); d = id(sched1_dur); en = id(sched1_enabled); break;
                  case 2: h = id(sched2_hour); m = id(sched2_min); d = id(sched2_dur); en = id(sched2_enabled); break;
                  case 3: h = id(sched3_hour); m = id(sched3_min); d = id(sched3_dur); en = id(sched3_enabled); break;
                }
                if (en && now.hour == h && now.minute == m && d > 0) {
                  id(feed_active) = true;
                  id(feed_duration) = d;
                  id(feed_remaining) = d;
                }
              }
  - platform: sntp
    id: sntp_time

# ===== GPS (NEO-6M/NEO-8M — Optional) =====
uart:
  id: uart_bus
  tx_pin: 7
  rx_pin: 8
  baud_rate: 9600

gps:
  id: gps_device
  uart_id: uart_bus

# ===== DISPLAY (SSD1306 128x64 SPI) =====
spi:
  clk_pin: 14
  mosi_pin: 15

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto"
    id: font_medium
    size: 12
  - file: "gfonts://Roboto"
    id: font_large
    size: 16

display:
  - platform: ssd1306_spi
    model: "SSD1306 128x64"
    cs_pin: 18
    dc_pin: 12
    rotation: 0
    lambda: |-
      auto now = id(rtc_time).now();
      int menu = id(menu_state);
      it.clear();

      if (id(feed_active)) {
        it.printf(0, 0, id(font_large), "FEEDING...");
        it.printf(0, 24, id(font_medium), "%ds left", id(feed_remaining));
        return;
      }

      switch (menu) {

        case 0:
          if (now.is_valid()) {
            it.strftime(0, 0, id(font_large), "%H:%M", now);
            it.strftime(0, 18, id(font_small), "%a %b %d", now);
          } else {
            it.printf(0, 0, id(font_large), "--:--");
            it.printf(0, 18, id(font_small), "No RTC time");
          }
          it.printf(0, 34, id(font_small), "Bat: %.2fV", id(battery_voltage).state);
          break;

        case 1:
          if (id(feed_active)) break;
          it.printf(0, 0, id(font_medium), "MANUAL FEED");
          it.printf(0, 18, id(font_small), "Duration: %ds", id(manual_duration));
          it.printf(0, 34, id(font_small), "UP/DN: adjust");
          it.printf(0, 50, id(font_small), "MANUAL: start");
          break;

        case 2:
          it.printf(0, 0, id(font_medium), "Schedules");
          for (int i = 0; i < 4; i++) {
            int h, m, d; bool en;
            switch (i) {
              case 0: h = id(sched0_hour); m = id(sched0_min); d = id(sched0_dur); en = id(sched0_enabled); break;
              case 1: h = id(sched1_hour); m = id(sched1_min); d = id(sched1_dur); en = id(sched1_enabled); break;
              case 2: h = id(sched2_hour); m = id(sched2_min); d = id(sched2_dur); en = id(sched2_enabled); break;
              case 3: h = id(sched3_hour); m = id(sched3_min); d = id(sched3_dur); en = id(sched3_enabled); break;
            }
            int y = 14 + i * 12;
            if (id(sched_cursor) == i) it.print(0, y, id(font_small), ">");
            it.printf(8, y, id(font_small), "S%d %s %02d:%02d %ds",
                      i + 1, en ? "ON " : "OFF", h, m, d);
          }
          break;

        case 3:
          {
            auto &tgps = id(gps_device).get_tiny_gps();
            it.printf(0, 0, id(font_medium), "GPS Status");
            it.printf(0, 18, id(font_small), "Sats: %d", tgps.satellites.value());
            it.printf(0, 34, id(font_small), "Lat: %.4f", tgps.location.lat());
            it.printf(0, 50, id(font_small), "Lon: %.4f", tgps.location.lng());
          }
          break;

        case 4:
          it.printf(0, 0, id(font_medium), "Settings");
          it.printf(0, 18, id(font_small), "Motor run: %ds", id(motor_runtime));
          it.printf(0, 34, id(font_small), "UP/DN: adjust");
          break;
      }

# ===== MOTOR CONTROL (DRV8871) =====
switch:
  - platform: gpio
    pin: GPIO19
    id: motor_in1
    internal: true
  - platform: gpio
    pin: GPIO20
    id: motor_in2
    internal: true

# ===== BUTTONS =====
binary_sensor:
  - platform: gpio
    pin: 0
    id: btn_power
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            int m = id(menu_state);
            if (m == 0) { id(menu_state) = 1; }
            else { id(menu_state) = 0; }

  - platform: gpio
    pin: 1
    id: btn_timer
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            int m = id(menu_state);
            m = (m + 1) % 5;
            id(menu_state) = m;

  - platform: gpio
    pin: 2
    id: btn_manual
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            if (id(menu_state) == 0) {
              id(feed_active) = true;
              id(feed_duration) = id(motor_runtime);
              id(feed_remaining) = id(motor_runtime);
            } else if (id(menu_state) == 1) {
              id(feed_active) = true;
              id(feed_duration) = id(manual_duration);
              id(feed_remaining) = id(manual_duration);
            }

  - platform: gpio
    pin: 3
    id: btn_settings
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            switch (id(menu_state)) {
              case 0:
                id(menu_state) = 4;
                break;
              case 2:
                {
                  int s = id(sched_cursor);
                  switch (s) {
                    case 0: id(sched0_enabled) = !id(sched0_enabled); break;
                    case 1: id(sched1_enabled) = !id(sched1_enabled); break;
                    case 2: id(sched2_enabled) = !id(sched2_enabled); break;
                    case 3: id(sched3_enabled) = !id(sched3_enabled); break;
                  }
                }
                break;
              case 3:
                id(menu_state) = 0;
                break;
            }

  - platform: gpio
    pin: 4
    id: btn_up
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            switch (id(menu_state)) {
              case 1:
                id(manual_duration) = std::min(60, id(manual_duration) + 1);
                break;
              case 2:
                id(sched_cursor) = (id(sched_cursor) + 1) % 4;
                break;
              case 3:
                break;
              case 4:
                id(motor_runtime) = std::min(60, id(motor_runtime) + 1);
                break;
            }

  - platform: gpio
    pin: 5
    id: btn_down
    internal: true
    filters:
      - delayed_on_off: 50ms
    on_press:
      then:
        - lambda: |-
            switch (id(menu_state)) {
              case 1:
                id(manual_duration) = std::max(1, id(manual_duration) - 1);
                break;
              case 2:
                id(sched_cursor) = (id(sched_cursor) + 3) % 4;
                break;
              case 3:
                break;
              case 4:
                id(motor_runtime) = std::max(1, id(motor_runtime) - 1);
                break;
            }

# ===== BATTERY MONITORING =====
sensor:
  - platform: adc
    pin: 6
    id: battery_voltage
    name: "Battery Voltage"
    update_interval: 60s
    unit_of_measurement: "V"
    accuracy_decimals: 2
    filters:
      - multiply: 2.0

# ===== CAN BUS =====
canbus:
  - platform: esp32_can
    id: can_bus
    tx_pin: 21
    rx_pin: 22
    can_id: 0x100
    bit_rate: 500kbps

# ===== GLOBALS =====
globals:
  - id: menu_state
    type: int
    initial_value: '0'
    restore_value: false
  - id: sched_cursor
    type: int
    initial_value: '0'
    restore_value: false
  - id: feed_active
    type: bool
    initial_value: 'false'
    restore_value: false
  - id: feed_duration
    type: int
    initial_value: '5'
    restore_value: false
  - id: feed_remaining
    type: int
    initial_value: '0'
    restore_value: false

  - id: manual_duration
    type: int
    initial_value: '5'
    restore_value: false

  - id: motor_runtime
    type: int
    initial_value: '5'
    restore_value: true

  # Schedule slots (persistent)
  - id: sched0_hour
    type: int
    initial_value: '8'
    restore_value: true
  - id: sched0_min
    type: int
    initial_value: '0'
    restore_value: true
  - id: sched0_dur
    type: int
    initial_value: '5'
    restore_value: true
  - id: sched0_enabled
    type: bool
    initial_value: 'true'
    restore_value: true
  - id: sched1_hour
    type: int
    initial_value: '18'
    restore_value: true
  - id: sched1_min
    type: int
    initial_value: '0'
    restore_value: true
  - id: sched1_dur
    type: int
    initial_value: '5'
    restore_value: true
  - id: sched1_enabled
    type: bool
    initial_value: 'false'
    restore_value: true
  - id: sched2_hour
    type: int
    initial_value: '12'
    restore_value: true
  - id: sched2_min
    type: int
    initial_value: '0'
    restore_value: true
  - id: sched2_dur
    type: int
    initial_value: '5'
    restore_value: true
  - id: sched2_enabled
    type: bool
    initial_value: 'false'
    restore_value: true
  - id: sched3_hour
    type: int
    initial_value: '0'
    restore_value: true
  - id: sched3_min
    type: int
    initial_value: '0'
    restore_value: true
  - id: sched3_dur
    type: int
    initial_value: '5'
    restore_value: true
  - id: sched3_enabled
    type: bool
    initial_value: 'false'
    restore_value: true

# ===== PERIODIC TASKS =====
interval:
  - interval: 30s
    then:
      - lambda: |-
          auto &tgps = id(gps_device).get_tiny_gps();
          if (tgps.time.isValid() && tgps.date.isValid() &&
              tgps.location.age() < 10000 && tgps.time.age() < 10000) {
            auto now = id(rtc_time).now();
            if (!now.is_valid()) {
              struct tm t = {};
              t.tm_year = tgps.date.year() - 1900;
              t.tm_mon = tgps.date.month() - 1;
              t.tm_mday = tgps.date.day();
              t.tm_hour = tgps.time.hour();
              t.tm_min = tgps.time.minute();
              t.tm_sec = tgps.time.second();
              setenv("TZ", "UTC0", 1);
              tzset();
              time_t epoch = mktime(&t);
              struct timeval tv = {.tv_sec = epoch, .tv_usec = 0};
              settimeofday(&tv, nullptr);
              id(rtc_time).write_time();
            }
          }

  - interval: 1s
    then:
      - lambda: |-
          if (id(feed_active)) {
            if (id(feed_remaining) > 0) {
              id(feed_remaining) = id(feed_remaining) - 1;
              id(motor_in1).turn_on();
              id(motor_in2).turn_off();
            } else {
              id(feed_active) = false;
              id(motor_in1).turn_off();
              id(motor_in2).turn_off();
            }
          }
