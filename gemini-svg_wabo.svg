  </defs>

  <g transform="translate(36, 16) scale(0.48)" fill="none" stroke="#0D0D0B" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="14" x2="62" y2="14"/>
    <line x1="10" y1="50" x2="62" y2="50"/>
    <line x1="10" y1="86" x2="62" y2="86"/>
    <line x1="36" y1="14" x2="36" y2="86"/>
    <path d="M 62,14 A 18,18 0 0 1 62,50" fill="none"/>
    <path d="M 62,50 A 18,18 0 0 1 62,86" fill="none"/>
  </g>

  <text x="62.4" y="94" class="name" text-anchor="middle">Wabo</text>
  <text x="62.6" y="106" class="sub" text-anchor="middle">Labs</text>
