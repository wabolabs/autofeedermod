<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 130" width="100%" height="100%">
  <defs>
    <style>
      /* Embedding Google Fonts via import */
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@700&amp;family=Space+Mono&amp;display=swap');
      
      .name {
        font-family: 'Cormorant SC', 'Georgia', serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.2em;
        fill: #0D0D0B;
      }
      .sub {
        font-family: 'Space Mono', monospace;
        font-size: 8px;
        letter-spacing: 0.65em;
        fill: #7A7870;
